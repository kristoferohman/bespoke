name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # pinned: Lua 5.1 installs and CI passes here (verified 2026-09-23)
    steps:
      - uses: actions/checkout@v5

      # WoW runs Lua 5.1, so test against exactly that
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check
        run: luac5.1 -p *.lua

      - name: Run test harness
        run: lua5.1 tests/test_harness.lua Bespoke.lua
