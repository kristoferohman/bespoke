name: Release

# Push a tag like v1.4.3 to build an installable zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test
        run: |
          luac5.1 -p Bespoke/*.lua
          lua5.1 tests/test_harness.lua Bespoke/Bespoke.lua

      # Refuse to release if the tag and the TOC disagree (e.g. forgot to bump the TOC)
      - name: Check version
        run: |
          TOC_VERSION=$(sed -n 's/^## Version: *//p' Bespoke/Bespoke.toc | tr -d '\r')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TOC $TOC_VERSION, tag $TAG_VERSION"
          test "$TOC_VERSION" = "$TAG_VERSION"

      - name: Package
        run: zip -r "Bespoke-${GITHUB_REF_NAME#v}.zip" Bespoke

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Bespoke-${GITHUB_REF_NAME#v}.zip" --generate-notes
